apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: district-team-test
namePrefix: test-

resources:
  - ../../base

replicas:
  - name: district-team
    count: 1

labels:
  - pairs:
      environment: test
    includeSelectors: true
    includeTemplates: true

patches:
  - target:
      kind: Namespace
      name: district-team
    patch: |-
      - op: replace
        path: /metadata/name
        value: district-team-test
  - path: config-map-patch.yaml
  - path: nginx-config-map-patch.yaml
  - path: certificate-patch.yaml
  - path: one-password-item-patch.yaml
